services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --api.dashboard=true
      - --api.insecure=true          # dashboard on :8080, no auth; only bound to localhost below
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"        # dashboard: reach via SSH tunnel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    restart: unless-stopped
    networks: [zbx-net]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabbix
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks: [zbx-net]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"   # proxies/active agents connect here
    depends_on: [postgres]
    networks: [zbx-net]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SSO_SETTINGS: "{'baseurl': '${ZBX_WEB_HOST}', 'use_proxy_headers': true}"
    volumes:
      - ./certs:/etc/zabbix/web/certs/
    labels:
      - traefik.enable=true
      - traefik.docker.network=zbx-net
      - traefik.http.routers.zabbix-web.rule=Host(`${ZBX_WEB_HOST}`)
      - traefik.http.routers.zabbix-web.entrypoints=websecure
      - traefik.http.routers.zabbix-web.tls.certresolver=le
      - traefik.http.services.zabbix-web.loadbalancer.server.port=8080
    depends_on: [zabbix-server]
    networks: [zbx-net]

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    environment:
      ZBX_HOSTNAME: Zabbix server     # must match the built-in "Zabbix server" host
      ZBX_SERVER_HOST: zabbix-server  # allowed for passive checks + target for active checks
    depends_on: [zabbix-server]
    restart: unless-stopped
    networks: [zbx-net]

networks:
  zbx-net:
    name: zbx-net
